"""Een natuurlijke persoon die in de Basisregistratie Personen is opgenomen, hetzij als ingezetene van een Nederlandse gemeente, hetzij als niet-ingezetene in de Registratie Niet-Ingezetenen."""
type IngeschrevenPersoon {
  """De officiële familienaam van de persoon."""
  geslachtsnaam: String!
  """Alle officiële voornamen van de persoon."""
  voornamen: String
  """Het voorvoegsel bij de geslachtsnaam."""
  voorvoegsel: String
  """Het door de Beheervoorziening BSN uitgegeven persoonsnummer."""
  bsn: BSN!
  """Inverse van Toestemming.houder."""
  heeftToestemming: [Toestemming!]
  """Inverse van OpenbareActiviteit.organisator."""
  organiseert: [OpenbareActiviteit!]
}

"""De juridische soort van een toestemming: de vorm waarin het bestuursorgaan haar verleent."""
enum SoortToestemming {
  """Toestemming binnen een verbod-behoudens-vergunningstelsel: de activiteit is verboden tenzij zij is vergund."""
  Vergunning
