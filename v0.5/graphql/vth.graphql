# Door een gemeentelijk bestuursorgaan verleende toestemmingen:
# vergunningen en ontheffingen met houder, geldigheid, status en de
# gegevens die per vergunningsoort verschillen. Pilotversie, beperkt tot
# toestemmingen die aan een natuurlijk persoon zijn verleend. Zaak,
# besluit, document en producttype worden als identificatie geleverd en
# niet als eigen objecttype.

"""Formaatrestrictie op een scalar, afgeleid uit het LinkML-datatype."""
directive @restrictie(
  """Reguliere expressie waaraan de waarde voldoet."""
  patroon: String
  """Ondergrens (inclusief) voor numerieke waarden."""
  minimum: Int
  """Bovengrens (inclusief) voor numerieke waarden."""
  maximum: Int
) on SCALAR

"""Burgerservicenummer: 9 cijfers met geldige elfproef. Als tekst getypeerd zodat een eventuele voorloopnul behouden blijft."""
scalar BSN @restrictie(patroon: "^[0-9]{9}$")
"""Kalenderdatum in ISO 8601, precisie tot op de dag (jjjj-mm-dd). Gebruikt voor de materiële tijdlijn."""
scalar Datum
"""Datum met tijdstip in ISO 8601, precisie tot op de seconde. Gebruikt voor de formele tijdlijn (registratiemoment)."""
scalar DatumTijd
"""Object- of documentidentificatie zonder vaste structuur."""
scalar Identificatie
"""Nederlands voertuigkenteken: zes posities (hoofdletters en cijfers) volgens het RDW-sidecodestelsel, optioneel met streepjes ter leesbaarheid (bijv. XX-99-99)."""
scalar Kenteken @restrictie(patroon: "^[A-Z0-9-]{6,8}$")
"""Tijdstip op de dag in ISO 8601, zonder datum (uu:mm:ss)."""
scalar Tijd

