# GEGENEREERD BESTAND — niet handmatig bewerken.
# GraphQL SDL voor bronprofiel BRI-plus, gegenereerd uit gbo-bron-bri-plus.yaml.
# Regenereer met: task generate:graphql
#
# De uitgebreide levering van de Belastingdienst: het authentiek
# inkomensgegeven (volledig, met vaststellingsdatum en
# vaststellingsbron), de onderliggende inkomensbestanddelen uit de
# loonketen, de vastgestelde aanslag inkomstenbelasting met de daarin
# vastgestelde rubrieken (Box 3-vermogen, aftrekposten, eigen woning,
# fiscaal partnerschap), de toegekende toeslagen en de door derden
# gedane renseigneringen. Levert uitsluitend gegevens voor ingeschreven
# personen (personen met een BSN) en uitsluitend over voorgaande,
# afgesloten belastingjaren; gegevens over het lopende jaar worden niet
# geleverd. De opvraagdatum is leveringsmetadata en staat in de
# antwoord-envelop van de levering, niet in het schema.

"""Formaatrestrictie op een scalar, afgeleid uit het LinkML-datatype."""
directive @restrictie(
  """Reguliere expressie waaraan de waarde voldoet."""
  patroon: String
  """Ondergrens (inclusief) voor numerieke waarden."""
  minimum: Int
  """Bovengrens (inclusief) voor numerieke waarden."""
  maximum: Int
) on SCALAR

"""Aanduiding van het aangiftetijdvak loonheffingen: jaar plus tijdvak-code, bijvoorbeeld 2026-M01 (maand) of 2026-W04 (vier weken). De kale jaarvorm (2026) duidt een jaaraggregaat aan, zoals de vooringevulde aangifte die per inkomstenbron levert."""
scalar Aangifteperiode @restrictie(patroon: "^[0-9]{4}(-[MW][0-9]{2})?$")
"""Burgerservicenummer: 9 cijfers met geldige elfproef. Als tekst getypeerd zodat een eventuele voorloopnul behouden blijft."""
scalar BSN @restrictie(patroon: "^[0-9]{9}$")
"""Landcode conform ISO 3166-1 alpha-2. Stelselbreed voor land- en nationaliteit-typering; cross-walks naar BRP-LT 32 (nationaliteit) en BRP-LT 34 (landen) staan in de documentatie."""
scalar CodelijstISO3166 @restrictie(patroon: "^[A-Z]{2}$")
"""Valuta-aanduiding conform ISO 4217 (drieletterige code, EUR)."""
scalar CodelijstISO4217 @restrictie(patroon: "^[A-Z]{3}$")
"""Kalenderdatum in ISO 8601, precisie tot op de dag (jjjj-mm-dd). Gebruikt voor de materiële tijdlijn."""
scalar Datum
"""Object- of documentidentificatie zonder vaste structuur."""
scalar Identificatie
"""Identificatie van een inschrijving in het Handelsregister: 8 cijfers."""
scalar KVKnummer @restrictie(patroon: "^[0-9]{8}$")
"""Landelijke objectidentificatie voor stelselobjecten, opgebouwd uit namespace, lokaalID en versie (NEN 3610)."""
scalar NEN3610ID

"""Een opgave van de gegevens die de grondslag voor een aanslag vormen: door of namens de belastingplichtige bij de Belastingdienst ingediend, dan wel door de Belastingdienst vooringevuld en nog niet ingediend."""
interface Aangifte implements FiscaleOpgave {
  """Het belastingjaar waarop de opgave betrekking heeft."""
  belastingjaar: Int!
  """De eigen woning die als rubriek in deze opgave is opgenomen."""
  omvatEigenWoning: [EigenWoning!]
  """Het fiscaal partnerschap dat als rubriek in deze opgave is opgenomen."""
  omvatFiscaalPartnerschap(belastingjaar: [Int!]): [FiscalePartner!]
  """De fiscale feiten die als rubriek in deze opgave zijn opgenomen."""
  omvatFiscaalFeit(belastingjaar: [Int!]): [FiscaalFeit!]
  """Identificatie van de aangifte."""
  aangifteIdentificatie: String!
  """Het stadium van de aangifte: vooringevuld, ingediend of herzien."""
  status: AangifteStatus!
  """Datum van feitelijke indiening; leeg zolang de aangifte alleen is vooringevuld."""
  indieningsdatum: Datum
  """Begin van de aangifteperiode."""
  ingangsdatumAangifte: Datum
  """Einde van de aangifteperiode."""
  einddatumAangifte: Datum
  """De belastingplichtige op wie de aangifte betrekking heeft."""
  betreft: IngeschrevenPersoon!
}

