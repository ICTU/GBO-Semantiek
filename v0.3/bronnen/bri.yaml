# =============================================================================
# Bron-profiel BRI — welke onderdelen van het GBO-informatiemodel de
# Basisregistratie Inkomen via GBO beschikbaar stelt.
#
# Dit bestand is LinkML-data conform het schema
# ../informatiemodel/linkml/bronprofiel.yaml (klasse Bronprofiel).
# Valideren:
#   linkml-validate -s ../informatiemodel/linkml/bronprofiel.yaml \
#       -C Bronprofiel bri.yaml
# Materialiseren:
#   python3 tools/genereer_bronschema.py v0.3/bronnen/bri.yaml
#
# De BRI levert uitsluitend het authentieke gegeven: verzamelinkomen of
# belastbaar jaarloon (inkomenBedrag), het belastingjaar en de BSN van
# de ingeschreven persoon. De onderliggende inkomensbestanddelen uit de
# loonketen zitten in het aparte profiel bri-plus.yaml.
# =============================================================================
bron: BRI
titel: Basisregistratie Inkomen
beschrijving: >-
  Het authentiek inkomensgegeven (verzamelinkomen of belastbaar
  jaarloon per persoon per belastingjaar), geleverd per BSN. Levert
  uitsluitend gegevens voor ingeschreven personen (personen met een
  BSN) en uitsluitend over voorgaande, afgesloten belastingjaren;
  gegevens over het lopende jaar worden niet geleverd. De opvraagdatum
  is leveringsmetadata en staat in de antwoord-envelop van de
  levering, niet in het schema.
schemabestand: ../informatiemodel/linkml/gbo.yaml

# Query-ingang: alleen IngeschrevenPersoon, alleen op bsn; geen
# lijst-query.
ingangen:
  - IngeschrevenPersoon
lijstQueries: false

objecttypen:
  - AuthentiekInkomen
  - IngeschrevenPersoon

# Whitelist: de BRI levert alleen deze gegevens. De navigatie van
# persoon naar inkomen (heeftAuthentiekInkomen) materialiseert de
# snoei-tool automatisch uit de inverse van gegrondvestOp.
insluitingen:
  - objecttype: AuthentiekInkomen
    attributen:
      - inkomenBedrag
      - belastingjaar
      - gegrondvestOp
  - objecttype: IngeschrevenPersoon
    attributen:
      - bsn

# Binnen de BRI is elke persoon een ingeschreven persoon (BSN-plicht):
relatieAfhandeling:
  - objecttype: AuthentiekInkomen
    relatie: gegrondvestOp
    afhandeling: vernauwen
    naar: IngeschrevenPersoon
