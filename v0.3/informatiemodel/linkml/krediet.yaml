      skos:altLabel_nl_1_value: Flash-lening
      skos:altLabel_nl_1_source: Algemeen taalgebruik
      skos:definition_nl: Een kredietovereenkomst met een korte looptijd, doorgaans korter dan drie maanden, met een betrekkelijk klein kredietbedrag.
      skos:definitionSource: Algemeen Reglement CKI 2024-07-01 art. 26
      skos:definitionSourceUri: https://www.bkr.nl/media/4dyezfiz/algemeen-reglement-cki-juli-2024.pdf
      skos:needsReview_0: 'Geen tweeletter-code: bevestigen of dit blijvend zo is in CKI of dat er een specifieke aanduiding wordt gebruikt.'
    comments:
