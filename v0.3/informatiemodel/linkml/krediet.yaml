      Reglement CKI alleen negatieve betalingservaringen aan het
      Centraal Krediet Informatiesysteem worden gemeld.
    annotations:
      mim:herkomst: CKI
      mim:herkomstDefinitie: >-
        Bron: Algemeen Reglement CKI (Stichting BKR), versie 1 juli
        2024. Wettelijke grondslag: Algemeen Reglement CKI van 1 juli
        2024, art. 25.
      mim:datumOpname: "2026-05-19"
      mim:populatie: >-
        Aan CKI gemelde overige zakelijke financiele verplichtingen
        boven EUR 1.000 die niet onder ZakelijkKrediet vallen, voor
        zover een negatieve betalingservaring is gemeld.
      skos:notation: ZO
      skos:status: proposed
      skos:prefLabel_nl: Zakelijke overige financiele verplichting
      skos:definition_nl: Een overige zakelijke financiele verplichting die niet onder ZakelijkKrediet valt en waarvan alleen negatieve betalingservaringen worden gemeld.
      skos:definitionSource: Algemeen Reglement CKI 2024-07-01 art. 25
      skos:definitionSourceUri: https://www.bkr.nl/media/4dyezfiz/algemeen-reglement-cki-juli-2024.pdf
    comments:
      - >-
        Zakelijke tegenhanger van de overige financiele verplichting
        prive. Net als RO alleen negatieve registratie. Bij combinatie
        van persoonlijke aansprakelijkheid en zakelijke verplichting
        kunnen zowel ZK als ZO van toepassing zijn.
    attributes:
