#
# De gegevens waarmee de Belastingdienst de aangifte inkomstenbelasting
# voorinvult: fiscaal partnerschap, aangifte-gegevens, inkomsten uit
# tegenwoordige en vroegere arbeid (loonketen-jaargegevens), eigen
# woning en overige onroerende zaken, bank- en effectentegoeden,
# schulden en de betrouwbaar voor te vullen aftrekposten (lijfrente,
# hypotheekrente). Levert uitsluitend gegevens voor binnenlands
# belastingplichtigen met een BSN; geen ondernemers (winst), geen
# M-biljet-situaties (migratie), en uitsluitend over voorgaande,
# afgesloten belastingjaren. De voorinvulling is een niet-vastgesteld
# gegeven: de definitieve aanslag kan afwijken. De opvraagdatum is
# leveringsmetadata en staat in de antwoord-envelop van de levering,
# niet in het schema.

"""Formaatrestrictie op een scalar, afgeleid uit het LinkML-datatype."""
directive @restrictie(
  """Reguliere expressie waaraan de waarde voldoet."""
  patroon: String
  """Ondergrens (inclusief) voor numerieke waarden."""
  minimum: Int
  """Bovengrens (inclusief) voor numerieke waarden."""
  maximum: Int
) on SCALAR

"""Aanduiding van het aangiftetijdvak loonheffingen: jaar plus tijdvak-code, bijvoorbeeld 2026-M01 (maand) of 2026-W04 (vier weken). De kale jaarvorm (2026) duidt een jaaraggregaat aan, zoals de vooringevulde aangifte die per inkomstenbron levert."""
scalar Aangifteperiode @restrictie(patroon: "^[0-9]{4}(-[MW][0-9]{2})?$")
"""Burgerservicenummer: 9 cijfers met geldige elfproef. Als tekst getypeerd zodat een eventuele voorloopnul behouden blijft."""
scalar BSN @restrictie(patroon: "^[0-9]{9}$")
"""Landcode conform ISO 3166-1 alpha-2. Stelselbreed voor land- en nationaliteit-typering; cross-walks naar BRP-LT 32 (nationaliteit) en BRP-LT 34 (landen) staan in de documentatie."""
scalar CodelijstISO3166 @restrictie(patroon: "^[A-Z]{2}$")
"""Valuta-aanduiding conform ISO 4217 (drieletterige code, EUR)."""
scalar CodelijstISO4217 @restrictie(patroon: "^[A-Z]{3}$")
"""Kalenderdatum in ISO 8601, precisie tot op de dag (jjjj-mm-dd). Gebruikt voor de materiële tijdlijn."""
scalar Datum
"""Object- of documentidentificatie zonder vaste structuur."""
scalar Identificatie
"""Identificatie van een inschrijving in het Handelsregister: 8 cijfers."""
scalar KVKnummer @restrictie(patroon: "^[0-9]{8}$")
"""Landelijke objectidentificatie voor stelselobjecten, opgebouwd uit namespace, lokaalID en versie (NEN 3610)."""
scalar NEN3610ID

