# GEGENEREERD BESTAND — niet handmatig bewerken.
# GraphQL SDL voor bronprofiel BRI-plus, gegenereerd uit gbo-bron-bri-plus.yaml.
# Regenereer met: task generate:graphql
#
# De uitgebreide inkomenslevering: het authentiek inkomensgegeven
# (volledig, met vaststellingsdatum en vaststellingsbron) plus de
# onderliggende inkomensbestanddelen uit de loonketen:
# inkomstenverhoudingen, inkomstenopgaven, inkomstenperioden,
# loonbestanddelen en loonaangiften. Levert uitsluitend gegevens voor
# ingeschreven personen (personen met een BSN) en uitsluitend over
# voorgaande, afgesloten belastingjaren; gegevens over het lopende jaar
# worden niet geleverd. De opvraagdatum is leveringsmetadata en staat in
# de antwoord-envelop van de levering, niet in het schema.

"""Formaatrestrictie op een scalar, afgeleid uit het LinkML-datatype."""
directive @restrictie(
  """Reguliere expressie waaraan de waarde voldoet."""
  patroon: String
  """Ondergrens (inclusief) voor numerieke waarden."""
  minimum: Int
  """Bovengrens (inclusief) voor numerieke waarden."""
  maximum: Int
) on SCALAR

"""Aanduiding van het aangiftetijdvak loonheffingen: jaar plus tijdvak-code, bijvoorbeeld 2026-M01 (maand) of 2026-W04 (vier weken). De kale jaarvorm (2026) duidt een jaaraggregaat aan, zoals de vooringevulde aangifte die per inkomstenbron levert."""
scalar Aangifteperiode @restrictie(patroon: "^[0-9]{4}(-[MW][0-9]{2})?$")
"""Burgerservicenummer: 9 cijfers met geldige elfproef. Als tekst getypeerd zodat een eventuele voorloopnul behouden blijft."""
scalar BSN @restrictie(patroon: "^[0-9]{9}$")
"""Valuta-aanduiding conform ISO 4217 (drieletterige code, EUR)."""
scalar CodelijstISO4217 @restrictie(patroon: "^[A-Z]{3}$")
"""Kalenderdatum in ISO 8601, precisie tot op de dag (jjjj-mm-dd). Gebruikt voor de materiële tijdlijn."""
scalar Datum
"""Identificatie van een inschrijving in het Handelsregister: 8 cijfers."""
scalar KVKnummer @restrictie(patroon: "^[0-9]{8}$")

"""Het door de Belastingdienst vastgestelde verzamelinkomen of belastbaar loon van een natuurlijk persoon over een belastingjaar, aangewezen als authentiek gegeven in de Basisregistratie Inkomen."""
type AuthentiekInkomen {
  """Verzamelinkomen of belastbaar loon."""
  inkomenBedrag: Bedrag!
  """Het jaar waarop het inkomen betrekking heeft."""
  belastingjaar: Int!
  """Datum van authentieke vaststelling."""
  vaststellingsdatum: Datum!
  """IH-aangifte of loonaangifte."""
  vaststellingsbron: VaststellingsbronInkomen!
  """De natuurlijk persoon op wie het authentieke inkomen is gegrondvest."""
  gegrondvestOp: IngeschrevenPersoon!
}

"""De administratieve relatie tussen een inhoudingsplichtige en een natuurlijk persoon op grond waarvan over een doorlopende periode loon wordt uitbetaald, sociale-zekerheids-premies worden ingehouden en aangifte loonheffingen wordt gedaan."""
type Inkomstenverhouding {
  """Uniek nummer voor de IKV."""
  nummerInkomstenverhouding: String!
  """Begindatum van de IKV."""
  begindatum: Datum!
  """Einddatum van de IKV."""
  einddatum: Datum
  """Aard van de arbeidsverhouding."""
  aardArbeidsverhouding: CodeAardArbeidsverhouding!
  """Soort IKV."""
  soortInkomstenverhouding: CodeSoortInkomstenverhouding!
  """Reden van einde IKV."""
  redenEinde: CodeRedenEindeArbeidsverhouding
  """De natuurlijk persoon (werknemer) in de IKV."""
  tussenPersoon: IngeschrevenPersoon!
  """De onderneming (werkgever) in de IKV. (Sleutel-referentie naar MaatschappelijkeActiviteit.)"""
  tussenWerkgever: KVKnummer!
  """De inkomstenopgaven binnen deze inkomstenverhouding, één per aangifteperiode."""
  heeftInkomstenopgave: [Inkomstenopgave!]
}

"""De aggregatie van loongegevens van een werknemer binnen een aangifte loonheffingen over een aangifteperiode, opgebouwd uit een of meer inkomstenperioden en alle daarop horende loonbestanddelen."""
type Inkomstenopgave {
  """Bijvoorbeeld 2026-M01, 2026-W04."""
  aangifteperiode: Aangifteperiode!
  """Bruto loon in de aangifteperiode."""
  loonHuidigPeriodeBedrag: Bedrag
  """Loon voor sociale verzekeringen."""
  loonSvBedrag: Bedrag
  """Ingehouden loonheffing."""
  ingehoudenLoonheffing: Bedrag
  """De inkomstenverhouding waarbinnen deze inkomstenopgave valt."""
  binnenInkomstenverhouding: Inkomstenverhouding!
  """De loonaangifte waarmee deze inkomstenopgave is aangeleverd."""
  binnenLoonAangifte: LoonAangifte!
  """De inkomstenperioden binnen deze inkomstenopgave."""
  heeftInkomstenperiode: [Inkomstenperiode!]
  """De loonbestanddelen binnen deze inkomstenopgave."""
  heeftLoonBestanddeel: [LoonBestanddeel!]
}

"""Een tijdvak binnen een inkomstenopgave waarin specifieke loongegevens gelden, zoals een week, een vier-weken-periode of een maand, met daarbinnen gewerkte uren, loonbestanddelen en eventuele afwijkingen."""
type Inkomstenperiode {
  """Startdatum van de periode."""
  begindatum: Datum!
  """Einddatum van de periode."""
  einddatum: Datum!
  """Aantal SV-dagen."""
  aantalSvDagen: Int
  """Contracturen in de periode."""
  aantalContractUren: Float
  """De inkomstenopgave waarbinnen deze inkomstenperiode valt."""
  binnenInkomstenopgave: Inkomstenopgave!
}

"""Een afzonderlijke component van het loon binnen een inkomstenopgave, gecodeerd volgens de soort-inkomen-codelijst en met een eigen bedrag, herkomst en fiscale behandeling."""
type LoonBestanddeel {
  """Aanduiding van het loonbestanddeel-type."""
  soortInkomen: CodeSoortInkomen!
  """Bedrag van het loonbestanddeel."""
  bedrag: Bedrag!
  """Vrije omschrijving."""
  omschrijving: String
  """De inkomstenopgave waarvan dit loonbestanddeel onderdeel is."""
  onderdeelVan: Inkomstenopgave!
}

"""De periodieke aangifte loonheffingen die een inhoudingsplichtige op grond van de Wet LB 1964 indient bij de Belastingdienst over een aangifteperiode, met alle inkomsten-verhoudingen en de daaruit voortvloeiende loonbestanddelen en in te houden bedragen."""
type LoonAangifte {
  """Aangifteperiode-aanduiding."""
  aangifteperiode: Aangifteperiode!
  """Totaal in te houden loonheffingen."""
  totaalLoonHeffingenBedrag: Bedrag
  """Totaal in te houden premies werknemersverzekeringen."""
  totaalPremieBedrag: Bedrag
  """Reguliere aangifte of correctie op een eerdere."""
  isCorrectieAangifte: Indicatie!
  """De onderneming (inhoudingsplichtige) die de loonaangifte heeft ingediend. (Sleutel-referentie naar MaatschappelijkeActiviteit.)"""
  ingediendDoor: KVKnummer!
  """De inkomstenopgaven die met deze loonaangifte zijn aangeleverd."""
  omvatInkomstenopgave: [Inkomstenopgave!]
}

"""Een natuurlijke persoon die in de Basisregistratie Personen is opgenomen, hetzij als ingezetene van een Nederlandse gemeente, hetzij als niet-ingezetene in de Registratie Niet-Ingezetenen."""
type IngeschrevenPersoon {
  """Het door de Beheervoorziening BSN uitgegeven persoonsnummer."""
  bsn: BSN!
  """De authentieke inkomens die voor deze persoon zijn vastgesteld, één per belastingjaar."""
  heeftAuthentiekInkomen(belastingjaar: Int): [AuthentiekInkomen!]
  """De inkomstenverhoudingen waarin deze persoon als werknemer staat."""
  heeftInkomstenverhouding: [Inkomstenverhouding!]
}

"""Geldbedrag: numerieke waarde met expliciete valuta-aanduiding (ISO 4217). Voor binnenlandse toepassingen impliciet EUR; de valuta wordt expliciet bij internationale uitwisseling."""
type Bedrag {
  """De numerieke waarde van het bedrag."""
  waarde: Float!
  """Valuta conform ISO 4217; bij afwezigheid geldt EUR."""
  valuta: CodelijstISO4217
}

"""De bron waaruit het authentieke inkomensgegeven is vastgesteld: de aanslag inkomstenbelasting of, bij het ontbreken daarvan, de loonaangifteketen."""
enum VaststellingsbronInkomen {
  """Vastgesteld op basis van de aanslag inkomstenbelasting: het verzamelinkomen."""
  IHAangifte
  """Vastgesteld op basis van de loonaangifteketen: het belastbaar jaarloon, gebruikt wanneer geen aanslag inkomstenbelasting wordt vastgesteld."""
  Loonaangifte
}

"""De codelijst voor de aard van de arbeidsverhouding tussen werkgever en werknemer, voor gebruik in de aangifte loonheffingen."""
enum CodeAardArbeidsverhouding {
  """Arbeidsovereenkomst voor onbepaalde tijd."""
  ArbeidsovereenkomstVast
  """Arbeidsovereenkomst voor bepaalde tijd."""
  ArbeidsovereenkomstTijdelijk
  """Stage-overeenkomst in opleiding."""
  Stagiair
  """Driehoeksrelatie via uitzendbureau."""
  Uitzendovereenkomst
  """Min-max- of nul-uren-overeenkomst."""
  Oproepovereenkomst
  """Beroepsbegeleidende leerweg-overeenkomst."""
  ArbeidsovereenkomstBBLOnderwijs
  """Wachtgeld-regeling overheid."""
  Wachtgeld
  """Bestuurder met aanmerkelijk belang."""
  DirecteurGrootaandeelhouder
  """Onbetaalde of beperkt vergoede inzet binnen fiscale grens."""
  Vrijwilligersregeling
  """Ambtelijke aanstelling overheid."""
  PubliekrechtelijkeAanstelling
}

"""De officiële codelijst voor de soort inkomstenverhouding (SIV) zoals vastgesteld door de werkgever of uitkerende instantie, voor gebruik in de aangifte loonheffingen en de vooringevulde aangifte."""
enum CodeSoortInkomstenverhouding {
  """Loon of salaris ambtenaren in de zin van de Ambtenarenwet."""
  LoonAmbtenaren
  """Loon of salaris directeuren van een nv/bv, wel verzekerd voor de werknemersverzekeringen."""
  LoonDirecteurNvBvVerzekerd
  """Loon of salaris niet onder te brengen onder code 11, 13 of 17."""
  LoonOverig
  """Loon of salaris directeur-grootaandeelhouder van een nv/bv, niet verzekerd voor de werknemersverzekeringen."""
  LoonDirecteurGrootaandeelhouder
  """Wachtgeld van een overheidsinstelling."""
  WachtgeldOverheid
  """Uitkering in het kader van de Algemene Ouderdomswet (AOW)."""
  UitkeringAOW
  """Oorlogs- en verzetspensioenen."""
  OorlogsEnVerzetspensioen
  """Uitkering in het kader van de Algemene nabestaandenwet (ANW)."""
  UitkeringANW
  """Uitkering in het kader van de Ziektewet (ZW), vrijwillige verzekering Ziektewet en Wet arbeid en zorg (WAZO)."""
  UitkeringZW
  """Uitkering in het kader van de Wet op de arbeidsongeschiktheidsverzekering (WAO) en particuliere verzekering ziekte, invaliditeit en ongeval."""
  UitkeringWAO
  """Uitkering in het kader van de Nieuwe Werkloosheidswet (nWW)."""
  UitkeringWW
  """Uitkering in het kader van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers (IOAW)."""
  UitkeringIOAW
  """Uitkering in het kader van de Wet arbeidsongeschiktheidsverzekering zelfstandigen (Waz)."""
  UitkeringWaz
  """Uitkering in het kader van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten (Wajong)."""
  UitkeringWajong
  """Samenloop (gelijktijdig of volgtijdelijk) van uitkeringen van Wajong met Waz, WAO/IVA of WGA."""
  SamenloopWajong
  """Uitkering in het kader van de Regeling inkomensvoorziening volledig arbeidsongeschikten (IVA)."""
  UitkeringIVA
  """Uitkering in het kader van de Regeling werkhervatting gedeeltelijk arbeidsgeschikten (WGA)."""
  UitkeringWGA
  """Uitkering in het kader van het Bijstandsbesluit zelfstandigen (Bbz)."""
  UitkeringBbz
  """Uitkering in het kader van de Participatiewet (voorheen WWB)."""
  UitkeringParticipatiewet
  """Uitkering in het kader van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen (IOAZ)."""
  UitkeringIOAZ
  """Uitkering uit hoofde van de Toeslagenwet."""
  UitkeringToeslagenwet
  """Uitkeringen in het kader van overige sociale verzekeringswetten, waaronder de Ongevallenwet 1921, de Land- en tuinbouwongevallenwet 1922 en de Zee-ongevallenwet 1919."""
  UitkeringOverigeSocialeVerzekeringswetten
  """Uitkering in het kader van de Wet inkomensvoorziening oudere werklozen (IOW)."""
  UitkeringIOW
  """Uitkeringen in het kader van vervroegde uittreding."""
  UitkeringVervroegdeUittreding
  """Uitkering in het kader van de Algemene Pensioenwet Politieke Ambtsdragers (APPA)."""
  UitkeringAPPA
  """Ouderdomspensioen dat via de werkgever is opgebouwd, of opgebouwd via een verplichte beroeps- of bedrijfstakpensioenregeling."""
  Ouderdomspensioen
  """Nabestaandenpensioen dat via de werkgever is opgebouwd, of opgebouwd via een verplichte beroeps- of bedrijfstakpensioenregeling."""
  Nabestaandenpensioen
  """Arbeidsongeschiktheidspensioen dat via de werkgever is opgebouwd, of opgebouwd via een verplichte beroeps- of bedrijfstakpensioenregeling."""
  Arbeidsongeschiktheidspensioen
  """Lijfrenten afgesloten in het kader van een individuele of collectieve arbeidsovereenkomst."""
  LijfrenteArbeidsovereenkomst
  """Lijfrenten die niet zijn afgesloten in het kader van een individuele of collectieve arbeidsovereenkomst."""
  LijfrenteOverig
  """Aanvullingen van de werkgever aan een werknemer op een uitkering werknemersverzekeringen, terwijl de dienstbetrekking is beëindigd."""
  AanvullingWerkgeverNaEindeDienstbetrekking
  """Ontslagvergoeding of transitievergoeding."""
  OntslagOfTransitievergoeding
  """Overige, niet hiervoor aangegeven, pensioenen of samenloop van meerdere pensioenen/lijfrenten of een betaling op grond van een afspraak na einde dienstbetrekking."""
  OverigPensioenOfSamenloop
}

"""De codelijst voor de reden van het einde van een arbeidsverhouding voor gebruik in de aangifte loonheffingen."""
enum CodeRedenEindeArbeidsverhouding {
  """Opzegging door de werknemer."""
  EindeOpInitiatiefWerknemer
  """Opzegging of ontslag door de werkgever."""
  EindeOpInitiatiefWerkgever
  """Beeindiging via vaststellingsovereenkomst."""
  WederzijdsGoedvinden
  """Aflopen tijdelijke arbeidsovereenkomst zonder verlenging."""
  EindeTijdelijkContractVanRechtswege
  """Rechterlijke ontbinding van de arbeidsovereenkomst."""
  OntbindingDoorKantonrechter
  """Pensionering volgens contract of cao."""
  VanRechtswegeBijPensioenGerechtigdeLeeftijd
  """Einde door overlijden."""
  OverlijdenVanDeWerknemer
  """Einde door faillissement van de inhoudingsplichtige."""
  FaillissementWerkgever
  """Overgang van onderneming."""
  OvergangNaarAndereWerkgever
  """Overige redenen niet expliciet genoemd."""
  Overig
}

"""De codelijst voor de soort inkomstenbestanddeel zoals dat in een aangifte loonheffingen of in een SBR-NT VIA-bericht wordt aangeleverd."""
enum CodeSoortInkomen {
  """Reguliere periodieke loonbetaling."""
  BrutoLoon
  """Vakantietoeslag."""
  Vakantiegeld
  """Dertiende-maandsuitkering."""
  DertiendeMaand
  """Eindejaarsuitkering buiten dertiende maand."""
  Eindejaarsuitkering
  """Incidentele bonusbetaling."""
  Bonus
  """Provisie of commissie."""
  Provisie
  """Vergoeding voor overuren."""
  OverwerkVergoeding
  """Structurele toeslagen zoals ploegen- of onregelmatigheidstoeslag."""
  StructureleToeslagen
  """Bijtelling auto van de zaak of vergelijkbaar."""
  Bijtelling
  """Eigen pensioenpremie-bijdrage van de werknemer."""
  PensioenpremieWerknemerEigen
}

"""Logische waarde met expliciete onbekendheid. GBO hanteert als NL-conventie een drie-waardig type in plaats van MIM-Boolean, zodat onbekendheid expliciet kan worden vastgelegd."""
enum Indicatie {
  """Waar."""
  Ja
  """Onwaar."""
  Nee
  """Onbekend; volgt de BRP-conventie voor afwezigheid en is geen MIM-Boolean-waarde."""
  Onbekend
}

"""Query-ingangen van dit bronprofiel."""
type Query {
  """Eén IngeschrevenPersoon op bsn."""
  ingeschrevenPersoon(bsn: BSN!): IngeschrevenPersoon
}
