# Taskfile for automating the GBO-Semantiek deployment process
#
# This Taskfile defines tasks for:
# - Validating tools and variables
# - Importing the QEA file into Crunch UML
# - Generating Markdown documentation, definitions, and Linked Data
# - Building and publishing documentation to GitHub Pages
#
# Usage:
# - Run `task --list` to see all available tasks.
# - Run `task <taskname>` to execute a specific task.
#
# Environment:
# - A `.env` file is used to load configuration variables like `VERSION`.
# - Ensure required tools are installed before running (`task prepare:check-tools`).
#
# Examples:
# - To perform a full deployment: `task full-deploy`
# - To generate documentation: `task generate:docs`
# - To generate Linked Data: `task generate:lod`
# - To publish documentation to GitHub Pages: `task publish:github`
#
# Author: Arjen Brienen
version: '3'

set: [pipefail]
shopt: [globstar]

dotenv: ['.env']

# Onderdruk de click UserWarning "parameter -V is used more than once"
# (bekende dubbele-optie-bug in de linkml-CLI; niet ons model).
env:
  PYTHONWARNINGS: 'ignore::UserWarning'

vars:
  # Alle Python-gereedschap komt uit de projecteigen venv, zodat er één
  # omgeving is in plaats van een mix van homebrew, pipx en systeem-python.
  # task kan PATH niet zetten via env:, dus de aanroepen zijn expliciet.
  VENV: "{{.ROOT_DIR}}/.venv/bin"
  VERSION_DIR: "./{{.VERSION}}"
  PREVIOUS_VERSION_DIR: "./{{.PREVIOUS_VERSION}}"
  GBO: "{{.VERSION_DIR}}/{{.INFORMATIEMODEL}}/{{.GBO_FILE}}"
  PREVIOUS_GBO: "{{.PREVIOUS_VERSION_DIR}}/{{.INFORMATIEMODEL}}/{{.GBO_FILE}}"
  LOD: "{{.VERSION_DIR}}/{{.ONTOLOGIE}}/{{.LOD_FILE}}"
  GBO_ROOT_SCHEMA: "GBO_ROOT_SCHEMA"
  GBO_PREVIOUS_SCHEMA_RAW: "GBO_PREVIOUS_SCHEMA_RAW"
  GBO_PREVIOUS_SCHEMA: "GBO_PREVIOUS_SCHEMA"
  CRUNCH_UML_DB: "./crunch_uml.db"
  DOCS: "./docs"
  DEFS: "./docs/definities"
  ROOT_GBO: "{{.ROOT_NODE_GBO}}"
  CHANGES_MD: "{{.VERSION_DIR}}/{{.CHANGES_MD_FILE}}"
  BEGRIPPEN_DIR: "{{.VERSION_DIR}}/begrippen"
  BEGRIPPEN: "{{.VERSION_DIR}}/begrippen/GBO-Begrippenkader.ttl"
  # LinkML-pipeline; moet vóór de vars staan die eraan refereren, want
  # task lost vars in declaratievolgorde op.
  LINKML_DIR: "{{.VERSION_DIR}}/{{.INFORMATIEMODEL}}/linkml"
  # Voorzieningenmodel: eigen schema en eigen ontologie-namespace naast de kern.
  VOORZIENINGEN_LINKML: "{{.LINKML_DIR}}/voorzieningen.yaml"
  VOORZIENINGEN_NS: "https://lod.gbo-semantiek.nl/voorzieningen"
  VOORZIENINGEN_LOD: "{{.VERSION_DIR}}/{{.ONTOLOGIE}}/GBO-Voorzieningen.ttl"
  VOORZIENINGEN_SHACL: "{{.VERSION_DIR}}/{{.ONTOLOGIE}}/GBO-Voorzieningen-Shapes.ttl"
  # Toestemmingenmodel: eigen schema en eigen ontologie-namespace naast de kern.
  TOESTEMMINGEN_LINKML: "{{.LINKML_DIR}}/toestemmingen.yaml"
  TOESTEMMINGEN_NS: "https://lod.gbo-semantiek.nl/toestemmingen"
  TOESTEMMINGEN_LOD: "{{.VERSION_DIR}}/{{.ONTOLOGIE}}/GBO-Toestemmingen.ttl"
  TOESTEMMINGEN_SHACL: "{{.VERSION_DIR}}/{{.ONTOLOGIE}}/GBO-Toestemmingen-Shapes.ttl"
  # Wiki-repo (modelleer-/bronrepo) waaruit model + profielen worden gekopieerd.
  # Override via env: `WIKI_REPO=/pad/naar/llm-wiki task import:copy`.
  WIKI_REPO: '{{.WIKI_REPO | default "../llm-wiki-GBI-core-model"}}'
  # LinkML-pipeline (informatiemodel, bron-profielen, GraphQL, LOD)
  GBO_LINKML: "{{.LINKML_DIR}}/gbo.yaml"
  PREVIOUS_LINKML: "{{.PREVIOUS_VERSION_DIR}}/{{.INFORMATIEMODEL}}/linkml/gbo.yaml"
  PREVIOUS_VOORZIENINGEN_LINKML: "{{.PREVIOUS_VERSION_DIR}}/{{.INFORMATIEMODEL}}/linkml/voorzieningen.yaml"
  PREVIOUS_TOESTEMMINGEN_LINKML: "{{.PREVIOUS_VERSION_DIR}}/{{.INFORMATIEMODEL}}/linkml/toestemmingen.yaml"
  BRONPROFIEL_SCHEMA: "{{.LINKML_DIR}}/bronprofiel.yaml"
  BRONNEN_DIR: "{{.VERSION_DIR}}/bronnen"
  CLIENTS_DIR: "{{.VERSION_DIR}}/clients"
  GRAPHQL_DIR: "{{.VERSION_DIR}}/graphql"
  SHACL: "{{.VERSION_DIR}}/{{.ONTOLOGIE}}/GBO-Shapes.ttl"

tasks:
  # ==========================================================================
  # Prepare — Voorwaarden valideren
  # ==========================================================================
  prepare:check-tools:
    desc: "Verify required tools are installed."
    silent: true
    cmds:
      - |
        # Systeemgereedschap: komt niet uit pip en moet op PATH staan.
        declare -A tools=(
          ["rsync"]="standaard op macOS/Linux"
          ["jq"]="https://stedolan.github.io/jq"
          ["python3"]="https://www.python.org/downloads/"
        )

        missing_tools=()
        for tool in "${!tools[@]}"; do
          if ! command -v $tool &> /dev/null; then
            missing_tools+=($tool)
          fi
        done

        if [ ${#missing_tools[@]} -ne 0 ]; then
          echo "Error: de volgende tools ontbreken:"
          for tool in "${missing_tools[@]}"; do
            echo "- $tool: ${tools[$tool]}"
          done
          exit 1
        fi

        # Python-gereedschap: komt uit de projecteigen venv.
        if [ ! -x "{{.VENV}}/python" ]; then
          echo "Error: geen virtuele omgeving gevonden in .venv/"
          echo "Aanmaken met:"
          echo "  python3 -m venv .venv"
          echo "  .venv/bin/python -m pip install -r requirements.txt"
          exit 1
        fi

        missing_venv=()
        for tool in mkdocs mike gen-owl gen-shacl gen-yaml linkml-validate; do
          if [ ! -x "{{.VENV}}/$tool" ]; then
            missing_venv+=($tool)
          fi
        done

        if [ ${#missing_venv[@]} -ne 0 ]; then
          echo "Error: de venv mist: ${missing_venv[*]}"
          echo "Bijwerken met: .venv/bin/python -m pip install -r requirements.txt"
          exit 1
        fi

        echo "Systeemtools aanwezig en venv compleet."


  prepare:check-vars:
    desc: "Validate required variables VERSION and check if VERSION_DIR exists."
    silent: true
    cmds:
      - |
        echo "Validating input parameter {{.VERSION}} ..."
      - |
        if [ -z "{{.VERSION}}" ]; then
          echo "Error: VERSION cannot be empty."
          exit 1
        fi
        if [[ ! "{{.VERSION}}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
          echo "Error: Invalid VERSION format. Use v{number}.{number} or v{number}.{number}.{number}, e.g., v0.1 or v1.0.0"
          exit 1
        fi
        if [ ! -d "{{.VERSION_DIR}}" ]; then
          echo "Error: Directory '{{.VERSION_DIR}}' does not exist."
          exit 1
        fi
      - |
        echo "VERSION {{.VERSION}} and Versiondir {{.VERSION_DIR}} are valid..."


  # ==========================================================================
  # Import — Model + profielen kopiëren uit de wiki-repo (modelleer-/bronrepo)
  # ==========================================================================
  import:copy:
    desc: "Kopieer LinkML-model + bron-/client-profielen uit de wiki-repo ({{.WIKI_REPO}})."
    deps: [prepare:check-tools, prepare:check-vars]
    cmds:
      - |
        if [ ! -d "{{.WIKI_REPO}}/publicatie/linkml" ]; then
          echo "Error: wiki-repo niet gevonden op '{{.WIKI_REPO}}'."
          echo "Zet WIKI_REPO in de omgeving of pas de default in Taskfile.yml aan."
          exit 1
        fi
      - echo "Kopiëren van model + profielen uit {{.WIKI_REPO}} ..."
      - mkdir -p "{{.LINKML_DIR}}" "{{.BRONNEN_DIR}}" "{{.CLIENTS_DIR}}"
      - rsync -a --delete "{{.WIKI_REPO}}/publicatie/linkml/"  "{{.LINKML_DIR}}/"
      - rsync -a --delete "{{.WIKI_REPO}}/publicatie/bronnen/" "{{.BRONNEN_DIR}}/"
      - rsync -a --delete "{{.WIKI_REPO}}/publicatie/clients/" "{{.CLIENTS_DIR}}/"
      # Fase 1: de publicatie-.md's (incl. bronnenprioritering) worden nog in de
      # wiki-repo (AI) geschreven en hier mee gekopieerd. Vervalt in Fase 2 (dan
      # genereert 'generate:docs' ze zelf uit de LinkML). bronnenprioritering
      # staat in de nav onder Uitgangspunten maar als bestand in gbo-kern, omdat
      # de wiki-repo de enige bron is en zijn relatieve links daar kloppen.
      - mkdir -p "{{.DOCS}}/{{.INFORMATIEMODEL}}/gbo-kern"
      - rsync -a --delete "{{.WIKI_REPO}}/publicatie/{{.INFORMATIEMODEL}}/" "{{.DOCS}}/{{.INFORMATIEMODEL}}/gbo-kern/"
      # Het voorzieningenmodel is een eigen model naast gbo-kern en landt
      # als losse pagina, zodat de bestaande nav en links blijven kloppen.
      - cp "{{.WIKI_REPO}}/publicatie/voorzieningen/voorzieningenmodel.md" "{{.DOCS}}/{{.INFORMATIEMODEL}}/gbo-voorzieningen.md"
      # Idem voor het toestemmingenmodel. Dit is een pilot en staat
      # daarom niet bij de kern- en voorzieningenmodellen, maar onder
      # informatiemodel/pilots/ (nav-kop "Informatiemodellen Pilots").
      - mkdir -p "{{.DOCS}}/{{.INFORMATIEMODEL}}/pilots"
      - cp "{{.WIKI_REPO}}/publicatie/toestemmingen/toestemmingenmodel.md" "{{.DOCS}}/{{.INFORMATIEMODEL}}/pilots/vergunningen-en-ontheffingen.md"
      - echo "Model, profielen en model-docs gekopieerd."
    sources:
      - "{{.WIKI_REPO}}/publicatie/**/*"
    generates:
      - "{{.LINKML_DIR}}/*.yaml"
      - "{{.BRONNEN_DIR}}/*.yaml"
      - "{{.CLIENTS_DIR}}/*.yaml"
    run: when_changed

  # ==========================================================================
  # Generate — Artifacts genereren uit het model
  # ==========================================================================
  generate:docs:
    desc: "Model-docs verversen uit de wiki-repo en versie-placeholders invullen."
    deps: [import:copy]
    cmds:
      - echo "Model-docs (gbo-kern) komen via 'import:copy' uit de wiki-repo (Fase 1)."
      - |
        # Vervang de versies in de uitwisselspecificatie-templates
        # Loop door alle .template-bestanden in de directory en submappen
        echo "Processing template files in {{.DOCS}} ..."
        for file in $(find "{{.DOCS}}" -type f -name "*.template"); do
          # Bepaal de doelbestandnaam door ".template" te verwijderen
          output_file="${file%.template}"

          # Gebruik sed om de placeholder ###VERSION### te vervangen door de versie
          sed "s/###VERSION###/{{.VERSION}}/g" "$file" > "$output_file"

          # Geef een bericht over de verwerking
          echo "Processed $file -> $output_file"
        done


  generate:check-model:
    desc: "Valideer het LinkML-informatiemodel (merge-check en lint)."
    deps: [prepare:check-vars, import:copy]
    cmds:
      - echo "Validating LinkML-model {{.GBO_LINKML}} ..."
      - '{{.VENV}}/gen-yaml "{{.GBO_LINKML}}" > /dev/null'
      - '{{.VENV}}/linkml lint --config .linkmllint.yaml "{{.GBO_LINKML}}"'
      - echo "LinkML-model is valide."


  generate:graphql:
    desc: "Genereer per bron-profiel een GraphQL SDL in {{.GRAPHQL_DIR}}."
    deps: [generate:check-model]
    sources:
      - "{{.BRONNEN_DIR}}/*.yaml"
      - "{{.LINKML_DIR}}/*.yaml"
      - ./tools/genereer_bronschema.py
      - ./tools/genereer_graphql.py
    generates:
      - "{{.GRAPHQL_DIR}}/*.graphql"
    cmds:
      - |
        mkdir -p "{{.GRAPHQL_DIR}}"
        for profiel in "{{.BRONNEN_DIR}}"/*.yaml; do
          bron=$(basename "$profiel" .yaml)
          echo "== Bron: $bron =="
          {{.VENV}}/linkml-validate -s "{{.BRONPROFIEL_SCHEMA}}" -C Bronprofiel "$profiel"
          {{.VENV}}/python tools/genereer_bronschema.py "$profiel" -o "/tmp/gbo-bron-$bron.yaml"
          {{.VENV}}/python tools/genereer_graphql.py "/tmp/gbo-bron-$bron.yaml" -o "{{.GRAPHQL_DIR}}/$bron.graphql"
        done
        echo "GraphQL SDL's gegenereerd in {{.GRAPHQL_DIR}}"


  generate:lod:
    desc: "Genereer Linked Data (OWL-ontologie en SHACL-shapes) uit het LinkML-model."
    deps: [generate:check-model]
    sources:
      - "{{.LINKML_DIR}}/*.yaml"
    generates:
      - "{{.LOD}}"
      - "{{.SHACL}}"
    cmds:
      - mkdir -p "{{.VERSION_DIR}}/{{.ONTOLOGIE}}"
      - |
        # Kwalificeer attribuut-URI's per deelmodel/klasse in een werkkopie:
        # gelijknamige attributen krijgen zo een eigen, diepe URI
        # (.../<deelmodel>/<Klasse>/<attr>) i.p.v. één platte, botsende URI.
        Q=/tmp/gbo-linkml-q
        rm -rf "$Q" && cp -r "{{.LINKML_DIR}}" "$Q"
        for f in "$Q"/*.yaml; do
          stem=$(basename "$f" .yaml)
          case "$stem" in gbo|bronprofiel|clientprofiel) continue;; esac
          {{.VENV}}/python tools/kwalificeer_uris.py "$f" --deelmodel "$stem" --in-place
        done
        echo "Generating OWL-ontologie '{{.LOD}}' ..."
        {{.VENV}}/gen-owl --no-use-native-uris --skip-vacuous-min-zero-cardinality-axioms \
          --skip-vacuous-local-range-axioms --consolidate-cardinality-axioms \
          "$Q/gbo.yaml" > "{{.LOD}}"
        # Brug GBO-lokale MIM-annotaties -> officiele MIM-ontologie (BP4MC2).
        cat tools/mim-mapping.ttl >> "{{.LOD}}"
        echo "Generating SHACL-shapes '{{.SHACL}}' ..."
        {{.VENV}}/gen-yaml "$Q/gbo.yaml" > /tmp/gbo-merged.yaml
        {{.VENV}}/python -c "import yaml; s=yaml.safe_load(open('/tmp/gbo-merged.yaml')); s.pop('imports',None); yaml.dump(s, open('/tmp/gbo-merged-noimports.yaml','w'), sort_keys=False, allow_unicode=True)"
        {{.VENV}}/gen-shacl /tmp/gbo-merged-noimports.yaml > "{{.SHACL}}"
      - echo "Linked Data gegenereerd."


  generate:voorzieningen-lod:
    desc: "Genereer OWL en SHACL voor het voorzieningenmodel in zijn eigen namespace."
    deps: [generate:check-model]
    sources:
      - "{{.LINKML_DIR}}/*.yaml"
      - tools/filter_namespace.py
      - tools/kwalificeer_uris.py
    generates:
      - "{{.VOORZIENINGEN_LOD}}"
      - "{{.VOORZIENINGEN_SHACL}}"
    cmds:
      - mkdir -p "{{.VERSION_DIR}}/{{.ONTOLOGIE}}"
      - |
        # Zelfde kwalificatie-slag als generate:lod, in een eigen werkkopie.
        Q=/tmp/gbo-linkml-vz
        rm -rf "$Q" && cp -r "{{.LINKML_DIR}}" "$Q"
        for f in "$Q"/*.yaml; do
          stem=$(basename "$f" .yaml)
          case "$stem" in gbo|bronprofiel|clientprofiel) continue;; esac
          {{.VENV}}/python tools/kwalificeer_uris.py "$f" --deelmodel "$stem" --in-place
        done
        # gen-owl/gen-shacl nemen het geimporteerde kernmodel mee; de
        # filterstap houdt alleen over wat voorzieningen.yaml zelf declareert.
        echo "Generating OWL-ontologie '{{.VOORZIENINGEN_LOD}}' ..."
        {{.VENV}}/gen-owl --skip-vacuous-min-zero-cardinality-axioms \
          --skip-vacuous-local-range-axioms --consolidate-cardinality-axioms \
          "$Q/voorzieningen.yaml" > /tmp/gbo-vz-owl-vol.ttl
        {{.VENV}}/python tools/filter_namespace.py --schema "$Q/voorzieningen.yaml" \
          --namespace "{{.VOORZIENINGEN_NS}}" \
          --input /tmp/gbo-vz-owl-vol.ttl --output "{{.VOORZIENINGEN_LOD}}"
        echo "Generating SHACL-shapes '{{.VOORZIENINGEN_SHACL}}' ..."
        {{.VENV}}/gen-yaml "$Q/voorzieningen.yaml" > /tmp/gbo-vz-merged.yaml
        {{.VENV}}/python -c "import yaml; s=yaml.safe_load(open('/tmp/gbo-vz-merged.yaml')); s.pop('imports',None); yaml.dump(s, open('/tmp/gbo-vz-merged-noimports.yaml','w'), sort_keys=False, allow_unicode=True)"
        {{.VENV}}/gen-shacl /tmp/gbo-vz-merged-noimports.yaml > /tmp/gbo-vz-shacl-vol.ttl
        {{.VENV}}/python tools/filter_namespace.py --schema "$Q/voorzieningen.yaml" \
          --namespace "{{.VOORZIENINGEN_NS}}" \
          --input /tmp/gbo-vz-shacl-vol.ttl --output "{{.VOORZIENINGEN_SHACL}}"


  generate:toestemmingen-lod:
    desc: "Genereer OWL en SHACL voor het toestemmingenmodel in zijn eigen namespace."
    deps: [generate:check-model]
    sources:
      - "{{.LINKML_DIR}}/*.yaml"
      - tools/filter_namespace.py
      - tools/kwalificeer_uris.py
    generates:
      - "{{.TOESTEMMINGEN_LOD}}"
      - "{{.TOESTEMMINGEN_SHACL}}"
    cmds:
      - mkdir -p "{{.VERSION_DIR}}/{{.ONTOLOGIE}}"
      - |
        # Zelfde kwalificatie-slag als generate:lod, in een eigen werkkopie.
        Q=/tmp/gbo-linkml-tm
        rm -rf "$Q" && cp -r "{{.LINKML_DIR}}" "$Q"
        for f in "$Q"/*.yaml; do
          stem=$(basename "$f" .yaml)
          case "$stem" in gbo|bronprofiel|clientprofiel) continue;; esac
          {{.VENV}}/python tools/kwalificeer_uris.py "$f" --deelmodel "$stem" --in-place
        done
        # gen-owl/gen-shacl nemen het geimporteerde kernmodel mee; de
        # filterstap houdt alleen over wat toestemmingen.yaml zelf declareert.
        echo "Generating OWL-ontologie '{{.TOESTEMMINGEN_LOD}}' ..."
        {{.VENV}}/gen-owl --skip-vacuous-min-zero-cardinality-axioms \
          --skip-vacuous-local-range-axioms --consolidate-cardinality-axioms \
          "$Q/toestemmingen.yaml" > /tmp/gbo-tm-owl-vol.ttl
        {{.VENV}}/python tools/filter_namespace.py --schema "$Q/toestemmingen.yaml" \
          --namespace "{{.TOESTEMMINGEN_NS}}" \
          --input /tmp/gbo-tm-owl-vol.ttl --output "{{.TOESTEMMINGEN_LOD}}"
        echo "Generating SHACL-shapes '{{.TOESTEMMINGEN_SHACL}}' ..."
        {{.VENV}}/gen-yaml "$Q/toestemmingen.yaml" > /tmp/gbo-tm-merged.yaml
        {{.VENV}}/python -c "import yaml; s=yaml.safe_load(open('/tmp/gbo-tm-merged.yaml')); s.pop('imports',None); yaml.dump(s, open('/tmp/gbo-tm-merged-noimports.yaml','w'), sort_keys=False, allow_unicode=True)"
        {{.VENV}}/gen-shacl /tmp/gbo-tm-merged-noimports.yaml > /tmp/gbo-tm-shacl-vol.ttl
        {{.VENV}}/python tools/filter_namespace.py --schema "$Q/toestemmingen.yaml" \
          --namespace "{{.TOESTEMMINGEN_NS}}" \
          --input /tmp/gbo-tm-shacl-vol.ttl --output "{{.TOESTEMMINGEN_SHACL}}"


  generate:begrippen:
    desc: "Genereer het SKOS-begrippenkader uit de SKOS-annotaties in de LinkML ({{.BEGRIPPEN}})."
    deps: [generate:check-model]
    sources:
      - "{{.LINKML_DIR}}/*.yaml"
      - tools/genereer_begrippen.py
    generates:
      - "{{.BEGRIPPEN}}"
    cmds:
      - |
        {{.VENV}}/python tools/genereer_begrippen.py \
          --linkml-dir "{{.LINKML_DIR}}" \
          --output "{{.BEGRIPPEN}}" \
          --versie "{{.VERSION}}"


  generate:diff:
    desc: "Genereer changelog t.o.v. {{.PREVIOUS_VERSION}} uit de LinkML-modellen ({{.CHANGES_MD}})."
    deps: [import:copy]
    cmds:
      - echo "Genereren changelog {{.PREVIOUS_VERSION}} -> {{.VERSION}} in {{.CHANGES_MD}} ..."
      # Een versie bevat drie schema's. Het voorzieningen- en het
      # toestemmingenmodel worden niet door gbo.yaml geimporteerd, dus een
      # diff op gbo.yaml alleen ziet ze niet; elk schema krijgt een sectie.
      - |
        {{.VENV}}/python tools/genereer_changelog.py \
          --previous "{{.PREVIOUS_LINKML}}" --previous-version "{{.PREVIOUS_VERSION}}" \
          --current  "{{.GBO_LINKML}}"      --current-version  "{{.VERSION}}" \
          --model    "Kernmodel" \
          --output   "{{.CHANGES_MD}}"
      - |
        {{.VENV}}/python tools/genereer_changelog.py \
          --previous "{{.PREVIOUS_VOORZIENINGEN_LINKML}}" \
          --previous-version "{{.PREVIOUS_VERSION}}" \
          --current  "{{.VOORZIENINGEN_LINKML}}" --current-version "{{.VERSION}}" \
          --model    "Voorzieningenmodel" --alleen-eigen --append \
          --output   "{{.CHANGES_MD}}"
      - |
        {{.VENV}}/python tools/genereer_changelog.py \
          --previous "{{.PREVIOUS_TOESTEMMINGEN_LINKML}}" \
          --previous-version "{{.PREVIOUS_VERSION}}" \
          --current  "{{.TOESTEMMINGEN_LINKML}}" --current-version "{{.VERSION}}" \
          --model    "Toestemmingenmodel" --alleen-eigen --append \
          --output   "{{.CHANGES_MD}}"


  generate:diagrams:
    desc: "(Voorlopig uitgeschakeld — Fase 1) drawio->SVG export."
    cmds:
      - |
        echo "generate:diagrams is voorlopig uitgeschakeld (Fase 1)."
        echo "Diagrammen komen als PlantUML-fences mee in de gekopieerde"
        echo "model-docs (gbo-kern) en worden door mkdocs gerenderd."


  # ==========================================================================
  # Build — MkDocs site bouwen en valideren
  # ==========================================================================
  build:validate:
    desc: "Build the MkDocs documentation in strict mode to check for errors."
    deps: [generate:docs]
    cmds:
      - echo "Validating MkDocs documentation..."
      - '{{.VENV}}/mkdocs build --strict --site-dir /tmp/gbo-semantiek-site'
      - echo "Documentation validation passed."


  build:site:
    desc: "Build the MkDocs site."
    deps: [generate:docs]
    cmds:
      - echo "Building MkDocs site..."
      - '{{.VENV}}/mkdocs build --clean'
      - echo "Site built successfully."


  build:serve:
    desc: "Start the local MkDocs development server met livereload (snelle preview, genereert geen docs vooraf; draai zo nodig eerst 'task import:copy' of 'task generate:docs')."
    cmds:
      - echo "Starting MkDocs development server met livereload..."
      - '{{.VENV}}/mkdocs serve --livereload --watch-theme'


  # ==========================================================================
  # Publish — Documentatie publiceren
  # ==========================================================================
  publish:check:
    desc: "Bewaak de publicatie: schone working tree, VERSION klopt met de versiemappen, en HEAD is nog niet als deze versie gepubliceerd."
    silent: true
    cmds:
      - |
        fout=0
        force="${FORCE_PUBLISH:-}"

        # 1. Schone working tree. Mike legt de commit-sha vast in de
        #    deploy-boodschap op gh-pages; publiceren met ongecommitte
        #    wijzigingen maakt die sha een onwaarheid: de gepubliceerde site
        #    is dan niet te reproduceren uit die commit.
        if [ -n "$(git status --porcelain)" ]; then
          echo "STOP: de working tree is niet schoon."
          echo "      Mike schrijft de commit-sha in de gh-pages-boodschap; met"
          echo "      ongecommitte wijzigingen klopt die sha niet meer."
          git status --short | sed 's/^/        /'
          fout=1
        fi

        # 2. VERSION komt overeen met de hoogste versiemap. Vangt de fout waarbij
        #    wel een nieuwe v-map is aangelegd maar .env nog op de vorige staat
        #    (of andersom), zodat mike de verkeerde versie zou overschrijven.
        hoogste=$(ls -d v[0-9]*.[0-9]* 2>/dev/null | sort -V | tail -1)
        if [ -z "$hoogste" ]; then
          echo "STOP: geen enkele versiemap (v0.x) gevonden."
          fout=1
        elif [ "$hoogste" != "{{.VERSION}}" ]; then
          echo "STOP: VERSION in .env is \"{{.VERSION}}\" maar de hoogste versiemap is \"$hoogste\"."
          echo "      Breng .env en de versiemappen met elkaar in overeenstemming."
          fout=1
        fi

        # 3. HEAD is nog niet als deze versie gepubliceerd. Zonder nieuwe commit
        #    levert een deploy dezelfde inhoud onder dezelfde sha op.
        huidig=$(git rev-parse --short HEAD)
        laatste=$(git log gh-pages -1 --format=%s 2>/dev/null || true)
        if [ -n "$laatste" ] && printf "%s" "$laatste" | grep -q "Deployed $huidig to {{.VERSION}}"; then
          echo "STOP: HEAD ($huidig) staat al als {{.VERSION}} op gh-pages."
          echo "      Laatste deploy: $laatste"
          fout=1
        fi

        if [ "$fout" -ne 0 ]; then
          if [ "$force" = "1" ]; then
            echo ""
            echo "FORCE_PUBLISH=1 gezet: bovenstaande bezwaren worden genegeerd."
          else
            echo ""
            echo "Publicatie afgebroken. Zet FORCE_PUBLISH=1 om toch te publiceren."
            exit 1
          fi
        else
          echo "Publicatiecontrole akkoord: working tree schoon, VERSION={{.VERSION}}, HEAD=$huidig nog niet gepubliceerd."
        fi


  publish:local:
    desc: "Deploy versioned documentation locally using Mike."
    # publish:check draait als enige dep, dus vóór alles: deps lopen parallel,
    # en de generate-stappen schrijven zelf in v{VERSION}/ en docs/. Zou de
    # controle daarnaast staan, dan zou zij haar eigen output als een vuile
    # working tree zien. De generatie staat daarom in cmds (sequentieel).
    deps: [publish:check]
    cmds:
      - task: generate:docs
      - task: generate:graphql
      - task: generate:lod
      - task: generate:voorzieningen-lod
      - task: generate:toestemmingen-lod
      - task: generate:begrippen
      - task: generate:diff
      - echo "Deploying documentation with Mike..."
      - '{{.VENV}}/mkdocs build --clean'
      - '{{.VENV}}/mike deploy "{{.VERSION}}" latest --update-aliases'
      # set-default op de alias, niet op de versie: de wortel-URL van de site
      # verwijst dan naar /latest/ en blijft na een nieuwe versie kloppen.
      # Zelfde inrichting als GBO, GBO-GO en GBO-PSA.
      - '{{.VENV}}/mike set-default latest'
      - echo "Documentation deployed locally. Use 'mike serve' to view results..."


  publish:main:
    desc: "Publiceer de huidige werkversie als 'main' in het mike-versiemenu."
    deps: [generate:docs, generate:graphql, generate:lod, generate:voorzieningen-lod, generate:toestemmingen-lod, generate:begrippen]
    cmds:
      # Naast de vastgestelde versies staat 'main' voor de stand van de
      # hoofdbranch: wat er nu in de documentatie zit, nog niet vastgesteld.
      # Bewust zonder alias en zonder set-default, zodat 'latest' de
      # gepubliceerde versie blijft aanwijzen.
      - '{{.VENV}}/mkdocs build --clean'
      - '{{.VENV}}/mike deploy main'
      - echo "Werkversie gepubliceerd als 'main'."


  publish:github:
    desc: "Publish the documentation directly to GitHub Pages."
    deps: [publish:local]
    prompt:
     - Dit commando publiceert de documentatie direct naar de LIVE GitHub pages. Doorgaan?
     - Weet je het zeker?
    cmds:
      - echo 'Deploying to GitHub Pages...'
      - git push origin gh-pages

  # ==========================================================================
  # Orchestratie
  # ==========================================================================
  full-deploy:
    desc: "Execute the entire deployment process: import, generate, build and publish."
    cmds:
      - task: build:validate
      - task: publish:local
      - echo "Full deployment completed."

