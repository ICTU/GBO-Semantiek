# mkdocs.yml — GBO-Semantiek documentatieconfiguratie
#
# Gebruik:
#   mkdocs serve          — lokale ontwikkelserver
#   mkdocs build          — statische site bouwen
#   mike deploy v0.1      — versie publiceren via mike
#
# Mike-integratie:
#   mike beheert gedocumenteerde versies op GitHub Pages (gh-pages branch).
#   Gebruik 'mike deploy --push --update-aliases <versie> latest' om te publiceren.
#   Zie docs/versiebeheer.md voor meer uitleg.

site_name: GBO-Semantiek
site_description: >-
  Het semantisch raamwerk van de Gemeenschappelijke Bronontsluiting — open
  specificatie met begrippenkader en informatiemodel voor het landelijk,
  sectoroverstijgend ontsluiten en delen van basisgegevens.
site_author: GBO-Semantiek Werkgroep
site_url: https://ictu.github.io/GBO-Semantiek/

# Repository-link in de navigatie
repo_name: ICTU/GBO-Semantiek
repo_url: https://github.com/ICTU/GBO-Semantiek
edit_uri: edit/main/docs/

# Documentatiedirectory
docs_dir: docs
site_dir: site

# Mike-versioning: stel in zodat mike de versie-informatie correct injecteert.
# alias: true toont de alias achter de versie in het versiemenu (v0.3 latest),
# net als bij GBO, GBO-GO en GBO-PSA. 'main' is de stand van de hoofdbranch.
extra:
  version:
    provider: mike
    alias: true
    default: latest

# Thema: Material (kleurstelling gelijk aan GBO, GBO-GO en GBO-PSA)
# language: custom + custom_dir: overrides -> zie overrides/partials/languages/custom.html
# (Nederlands, met een zoekplaceholder die aangeeft dat er alleen binnen dit
#  GBO-onderdeel gezocht wordt). Zelfde patroon als GBO-GO en GBO-PSA.
theme:
  name: material
  language: custom
  custom_dir: overrides
  # Geen primary/accent: net als de andere GBO-onderdelen wordt de standaard
  # Material-kleurstelling (indigo) gebruikt. Het schema volgt de voorkeur van
  # het besturingssysteem (nachtstand -> slate); de toggle in de header
  # schakelt handmatig om. Zelfde gedrag als GBO, GBO-GO en GBO-PSA.
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Schakel naar licht thema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Schakel naar donker thema
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/icon.svg
  favicon: assets/icon.svg

# Plugins
plugins:
  - search:
      lang: nl
  - glightbox
  # canonical_version: verwijst alle versies naar de /latest/-URL als canoniek
  - mike:
      canonical_version: "latest"

# Custom CSS
extra_css:
  - assets/stylesheets/custom.css

# Custom JavaScript
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js

# Markdown-extensies
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      title: Op deze pagina
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - plantuml_markdown:
      format: svg
      plantuml_cmd: /opt/homebrew/bin/plantuml
      cachedir: .cache/plantuml
      classes: "uml"
      alt: "GBO PlantUML class-diagram"
      title: "GBO"

# Navigatiestructuur
# Hoofdmenu (tabs bovenin): de onderdelen van de Gemeenschappelijke Bronontsluiting.
# Externe onderdelen zijn absolute links naar de eigen documentatiesites; alleen
# 'Semantiek' is lokaal en klapt links uit in secties met per pagina rechts de TOC.
# Houd deze lijst gelijk aan die van GBO, GBO-GO en GBO-PSA.
nav:
  - Gemeenschappelijke Bronontsluiting: https://ictu.github.io/GBO/
  - Context: https://ictu.github.io/GBO/latest/context
  - Globaal Ontwerp: https://ictu.github.io/GBO-GO/
  - Projectstartarchitectuur: https://ictu.github.io/GBO-PSA/
  - Technisch Ontwerp: https://ictu.github.io/GBO/main/underconstruction_to/
  - Technische Requirements: https://ictu.github.io/GBO/main/underconstruction_tr/
  - Semantiek:
    - Inleiding: index.md
    - Uitgangspunten:
      - Ontwerprincipes: uitgangspunten/ontwerpprincipes.md
      - Kaders en standaarden: uitgangspunten/kaders_standaarden.md
      - Bronnenprioritering: informatiemodel/gbo-kern/bronnenprioritering.md
    - Architectuur:
      - Gegevensarchitectuur: architectuur/gegevensarchitectuur.md
      - Gegevenscomponenten: architectuur/gegevenscomponenten.md
    - "Begrippenmodel":
      - Inleiding: begrippen/inleiding.md
    - "Informatiemodel: GBO-Kernmodel":
      - Hoofdmodel: informatiemodel/gbo-kern/hoofdmodel.md
      - Hoofdmodel (compact): informatiemodel/gbo-kern/hoofdmodel-compact.md
      - Deelmodel Personen: informatiemodel/gbo-kern/deelmodellen/personen.md
      - Deelmodel Bedrijven en Instellingen: informatiemodel/gbo-kern/deelmodellen/bedrijven-en-instellingen.md
      - Deelmodel Adressen en Gebouwen: informatiemodel/gbo-kern/deelmodellen/adressen-en-gebouwen.md
      - Deelmodel Onroerende Zaken: informatiemodel/gbo-kern/deelmodellen/onroerende-zaken.md
      - Deelmodel Waarde Onroerende Zaken: informatiemodel/gbo-kern/deelmodellen/waarde-onroerende-zaken.md
      - Deelmodel Belastingen: informatiemodel/gbo-kern/deelmodellen/belastingen.md
      - Deelmodel Krediet: informatiemodel/gbo-kern/deelmodellen/krediet.md
      - Deelmodel Onderwijs: informatiemodel/gbo-kern/deelmodellen/onderwijs.md
      - Deelmodel Werk en Inkomen: informatiemodel/gbo-kern/deelmodellen/werk-en-inkomen.md
      - Deelmodel Voertuigen: informatiemodel/gbo-kern/deelmodellen/voertuigen.md
      - Datatypes en codelijsten: informatiemodel/gbo-kern/datatypes-en-codelijsten.md
    - "Informatiemodel: GBO-Voorzieningenmodel":
      - Hoofdmodel: informatiemodel/gbo-voorzieningen.md
    - "Ontologie":
      - Inleiding: ontologie/inleiding.md
    - Implementatie:
      - URI-strategie: implementatie/uri-strategie.md
      - Naamgeving: implementatie/naamgeving.md
      - Deployment: implementatie/deployment.md
      - Publicatie: implementatie/publicatie.md
    - Bijlagen:
      - Woordenlijst: bijlagen/woordenlijst.md
      - Tooling: bijlagen/tooling.md
      - URI-namespace: bijlagen/uri-namespace.md
  - Demo: https://gbo.simulatie.datastelsel.nl/
